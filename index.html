'use strict';
const KEY='businessledger_lite_v1';const today=()=>new Date().toLocaleDateString('en-CA');const money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>globalThis.crypto?.randomUUID?.()||('id'+Date.now()+Math.random().toString(36).slice(2));const starter=()=>({transactions:[],closes:[],demo:false});let state;try{state=JSON.parse(localStorage.getItem(KEY))||starter()}catch{state=starter()}if(!Array.isArray(state.transactions)||!Array.isArray(state.closes))state=starter();let page='dashboard',editId=null,filterDate=today(),reportPeriod='day',reportDate=today(),closeDate=today(),notice='';

function sums(rows){return rows.reduce((a,t)=>{if(t.kind==='income'){a.revenue+=t.amount;a.direct+=t.cost;a[t.activity]+=t.amount;a[t.activity+'Cost']+=t.cost;a[t.method+'In']+=t.amount;a.count++}else{a.expenses+=t.amount;if(t.method==='cash')a.cashOut+=t.amount}return a},{revenue:0,direct:0,expenses:0,sales:0,repairs:0,salesCost:0,repairsCost:0,cashIn:0,cardIn:0,cashOut:0,count:0})}function byPeriod(t,period,date){return period==='all'||(period==='day'?t.date===date:period==='month'?t.date.slice(0,7)===date.slice(0,7):t.date.slice(0,4)===date.slice(0,4))}function filtered(period=reportPeriod,date=reportDate){return state.transactions.filter(t=>byPeriod(t,period,date))}function profit(a){return a.revenue-a.direct-a.expenses}function metric(label,value){return `<div class="metric"><span class="label">${label}</span><strong>${value}</strong></div>`}function margin(rev,cost){return rev?((rev-cost)/rev*100).toFixed(1)+'%':'—'}function line(label,value){return `<div class="row" style="margin:10px 0"><span>${label}</span><strong>${value}</strong></div>`}function activity(name,rev,cost,total){return `<div style="margin:12px 0"><div class="row"><strong>${name}</strong><span>${money(rev)} · Gross profit ${money(rev-cost)}</span></div><div class="bar" style="margin:8px 0"><div class="fill ${name==='Repairs'?'green':''}" style="width:${total?100*rev/total:0}%"></div></div><div class="muted">Gross margin ${margin(rev,cost)}</div></div>`}

;document.getElementById('period').onchange=e=>{reportPeriod=e.target.value;renderDashboard()};document.getElementById('reportDate').onchange=e=>{reportDate=e.target.value;renderDashboard()};document.getElementById('quickAdd').onclick=()=>{page='ledger';editId=null;render()};document.getElementById('goClose').onclick=()=>{page='close';closeDate=reportDate;render()}}
function transactionForm(){const t=state.transactions.find(t=>t.id===editId)||{kind:'income',activity:'sales',method:'cash',date:today(),amount:'',cost:'',description:'',category:'supplies'};return `<div class="panel"><div class="row"><h2>${editId?'Edit':'Add'} transaction</h2>${editId?'<button class="secondary" id="cancelEdit">Cancel edit</button>':''}</div><form id="txForm"><div class="fields"><div><label>Type</label><select name="kind" id="txKind"><option value="income" ${t.kind==='income'?'selected':''}>Income</option><option value="expense" ${t.kind==='expense'?'selected':''}>Expense</option></select></div><div><label>Date</label><input name="date" type="date" value="${esc(t.date)}" required></div><div id="activityField"><label>Income category</label><select name="activity"><option value="sales" ${t.activity==='sales'?'selected':''}>Product sale</option><option value="repairs" ${t.activity==='repairs'?'selected':''}>Repair</option></select></div><div id="expenseField"><label>Expense category</label><select name="category">${['supplies','rent','utilities','wages','transport','marketing','fees','other'].map(x=>`<option value="${x}" ${t.category===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></div><div><label>Amount (CAD)</label><input name="amount" type="number" min="0.01" step="0.01" value="${esc(t.amount)}" required></div><div id="costField"><label>Direct cost (CAD)</label><input name="cost" type="number" min="0" step="0.01" value="${esc(t.cost)}" placeholder="0"></div><div><label>Payment method</label><select name="method"><option value="cash" ${t.method==='cash'?'selected':''}>Cash</option><option value="card" ${t.method==='card'?'selected':''}>Credit card</option></select></div><div class="full"><label>Description (optional)</label><input name="description" maxlength="180" value="${esc(t.description)}" placeholder="What was sold, repaired or paid for?"></div></div><button type="submit">${editId?'Save changes':'Save transaction'}</button></form></div>`}
function renderLedger(){const rows=state.transactions.filter(t=>!filterDate||t.date===filterDate).sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created));document.getElementById('ledger').innerHTML=`<div class="row" style="margin-bottom:16px"><div><h1>Ledger</h1><div class="muted">One place for every sale, repair and expense</div></div><button class="secondary" id="sampleBtn">${state.demo?'Sample data loaded':'Load sample data'}</button></div>${transactionForm()}<div class="panel"><div class="row"><h2>Transaction history (${rows.length})</h2><div class="sectionactions"><input type="date" id="filterDate" value="${filterDate}" aria-label="Filter by date"><button class="secondary" id="showAll">All dates</button></div></div><div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Payment</th><th class="num">Amount</th><th class="num">Direct cost</th><th></th></tr></thead><tbody>${rows.length?rows.map(t=>`<tr><td>${esc(t.date)}</td><td>${t.kind==='income'?(t.activity==='sales'?'Product sale':'Repair'):'Expense · '+esc(t.category)}</td><td>${esc(t.description)||'—'}</td><td>${t.method==='cash'?'Cash':'Card'}</td><td class="num">${money(t.amount)}</td><td class="num">${t.kind==='income'?money(t.cost):'—'}</td><td class="actions"><button class="secondary" data-edit="${t.id}">Edit</button><button class="danger" data-delete="${t.id}">Delete</button></td></tr>`).join(''):'<tr><td colspan="7">No transactions for this date. Select All dates or add a transaction.</td></tr>'}</tbody></table></div></div>`;const f=document.getElementById('txForm');function toggle(){const income=f.elements.kind.value==='income';document.getElementById('activityField').classList.toggle('hidden',!income);document.getElementById('costField').classList.toggle('hidden',!income);document.getElementById('expenseField').classList.toggle('hidden',income)}f.elements.kind.onchange=toggle;toggle();f.onsubmit=e=>{e.preventDefault();const d=new FormData(f),kind=d.get('kind'),amount=Number(d.get('amount')),cost=kind==='income'?Number(d.get('cost')||0):0,date=d.get('date');if(!date||!Number.isFinite(amount)||amount<=0||!Number.isFinite(cost)||cost<0){flash('Enter a valid date and nonnegative amounts; transaction amount must be greater than zero.',true);return}const old=state.transactions.find(t=>t.id===editId);const item={id:old?.id||id(),created:old?.created||new Date().toISOString(),kind,date,amount:Math.round(amount*100)/100,cost:Math.round(cost*100)/100,activity:kind==='income'?d.get('activity'):null,category:kind==='expense'?d.get('category'):null,method:d.get('method'),description:String(d.get('description')||'').trim()};if(old){state.transactions=state.transactions.map(t=>t.id===old.id?item:t);markClose(old.date);markClose(date)}else{state.transactions.push(item);markClose(date)}editId=null;persist();render();flash('Transaction saved.')};document.getElementById('filterDate').onchange=e=>{filterDate=e.target.value;renderLedger()};document.getElementById('showAll').onclick=()=>{filterDate='';renderLedger()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;renderLedger();window.scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this transaction? This cannot be undone.')){const t=state.transactions.find(t=>t.id===b.dataset.delete);state.transactions=state.transactions.filter(x=>x.id!==b.dataset.delete);markClose(t.date);persist();render();flash('Transaction deleted.')}});document.getElementById('sampleBtn').onclick=loadSamples;document.getElementById('cancelEdit')?.addEventListener('click',()=>{editId=null;renderLedger()})}
function markClose(date){const c=state.closes.find(c=>c.date===date);if(c)c.stale=true}function cashFor(date){const a=sums(state.transactions.filter(t=>t.date===date));return {received:a.cashIn,spent:a.cashOut,card:a.cardIn,revenue:a.revenue,count:a.count}}
function renderClose(){const c=state.closes.find(c=>c.date===closeDate),a=cashFor(closeDate);document.getElementById('close').innerHTML=`<div class="row" style="margin-bottom:16px"><div><h1>Daily Close</h1><div class="muted">Count your cash and confirm the day's totals</div></div><input type="date" id="closeDate" value="${closeDate}" aria-label="Closing date"></div><div class="two"><div class="panel"><h2>Cash reconciliation</h2><form id="closeForm"><div class="fields"><div><label>Opening cash (CAD)</label><input type="number" step="0.01" min="0" name="opening" value="${c?c.opening:0}" required></div><div><label>Actual cash counted (CAD)</label><input type="number" step="0.01" min="0" name="actual" value="${c?c.actual:''}" placeholder="Count the cash drawer" required></div><div class="full"><label>Notes (optional)</label><textarea name="notes" rows="2" placeholder="Explain any difference">${esc(c?.notes||'')}</textarea></div></div><div id="calculated"></div><button type="submit">${c?'Update daily close':'Save daily close'}</button></form></div><div class="panel"><h2>Recorded activity</h2>${line('Cash received',money(a.received))}${line('Cash expenses',money(a.spent))}${line('Card received',money(a.card))}${line('Total income',money(a.revenue))}${line('Income transactions',a.count)}<p class="hint">Only cash operating expenses reduce expected cash. Direct costs are used for profit analysis, not deducted from the drawer unless separately recorded as cash expenses. Avoid double-counting costs.</p>${c?`<div class="notice ${c.stale?'error':''}">${c.stale?'Transactions changed since this close. Please review and save again.':'Saved close · '+esc(c.savedAt.slice(0,10))}</div>`:''}</div></div><div class="panel"><h2>Recent daily closings</h2><div class="scroll"><table><thead><tr><th>Date</th><th class="num">Expected</th><th class="num">Actual</th><th class="num">Difference</th><th>Status</th></tr></thead><tbody>${state.closes.length?state.closes.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`<tr><td>${esc(c.date)}</td><td class="num">${money(c.expected)}</td><td class="num">${money(c.actual)}</td><td class="num">${money(c.actual-c.expected)}</td><td>${c.stale?'Needs review':'Saved'}</td></tr>`).join(''):'<tr><td colspan="5">No daily closings saved yet.</td></tr>'}</tbody></table></div></div>`;document.getElementById('closeDate').onchange=e=>{closeDate=e.target.value;renderClose()};const f=document.getElementById('closeForm');function calc(){const opening=Number(f.elements.opening.value)||0,expected=opening+a.received-a.spent,actual=f.elements.actual.value===''?null:Number(f.elements.actual.value),variance=actual===null?null:actual-expected;document.getElementById('calculated').innerHTML=`${line('Expected closing cash',money(expected))}${line('Cash variance',variance===null?'Enter actual cash':money(variance))}<p class="hint">${variance===null?'Enter your cash count to calculate the difference.':Math.abs(variance)<.005?'Cash matches.':variance>0?'Cash overage.':'Cash shortage.'}</p>`}f.oninput=calc;calc();f.onsubmit=e=>{e.preventDefault();const opening=Number(f.elements.opening.value),actual=Number(f.elements.actual.value);if(!Number.isFinite(opening)||!Number.isFinite(actual)||opening<0||actual<0||f.elements.actual.value===''){flash('Enter valid nonnegative opening and counted cash amounts.',true);return}const expected=Math.round((opening+a.received-a.spent)*100)/100;const record={date:closeDate,opening,actual,expected,notes:f.elements.notes.value.trim(),savedAt:new Date().toISOString(),stale:false};state.closes=state.closes.filter(c=>c.date!==closeDate).concat(record);persist();render();flash('Daily close saved.')};}

function loadSamples(){if(state.demo){flash('Sample data is already loaded.');return}if(!confirm('Add illustrative sample transactions? Your existing records will remain.'))return;const added=sampleTransactions();state.transactions.push(...added);state.demo=true;for(const date of new Set(added.map(t=>t.date)))markClose(date);persist();render();flash('Illustrative sample transactions added.');}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}function csv(){const headers=['ID','Date','Type','Category','Payment','Description','Amount','Direct Cost'];const rows=state.transactions.map(t=>[t.id,t.date,t.kind,t.kind==='income'?t.activity:t.category,t.method,t.description,t.amount,t.cost]);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('businessledger-transactions.csv',[headers,...rows].map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}function backup(){download('businessledger-backup.json',JSON.stringify({app:'BusinessLedger',version:1,exportedAt:new Date().toISOString(),data:state},null,2),'application/json')}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));['dashboard','ledger','close'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==page));renderDashboard();renderLedger();renderClose()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.getElementById('backupBtn').onclick=()=>{const action=prompt('Backup / Export: enter 1 for JSON backup, 2 for CSV export, or 3 to restore JSON backup.','1');if(action==='1')backup();else if(action==='2')csv();else if(action==='3')document.getElementById('importFile').click()};document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const raw=JSON.parse(await file.text()),d=raw.data;if(!['BusinessLedger','BusinessLedger Lite'].includes(raw.app)||!Array.isArray(d?.transactions)||!Array.isArray(d?.closes)||d.transactions.some(t=>!['income','expense'].includes(t.kind)||!Number.isFinite(t.amount)||typeof t.date!=='string')||d.closes.some(c=>typeof c.date!=='string'||!Number.isFinite(c.expected))){throw Error('Invalid backup file')}if(!confirm('Restore this backup? It will replace all current Lite data. Export a backup first if needed.'))return;state={transactions:d.transactions,closes:d.closes,demo:!!d.demo};persist();render();flash('Backup restored.')}catch(err){flash('Unable to restore: '+err.message,true)}finally{e.target.value=''}};if(shouldSeed){state.transactions=sampleTransactions();state.demo=true;persist()}render();
